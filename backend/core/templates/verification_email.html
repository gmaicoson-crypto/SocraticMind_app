<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{app_name} 验证码</title>
    <!--
    邮件 HTML 规范：内联 style 是主力，因大多数邮件客户端会屏蔽外部 CSS 及 <style> 块。
    此处 <style> 仅作为支持它的客户端（如 Apple Mail）的增强，不能作为唯一样式来源。
  -->
    <style>
      body {{ margin: 0; padding: 0; background: #f6f8fb; }}
    </style>
  </head>
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f6f8fb;
      font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    "
  >
    <!-- 邮件主体容器，限制最大宽度并居中 -->
    <div
      style="
        max-width: 520px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #e7ebf1;
        border-radius: 14px;
        padding: 32px;
      "
    >
      <!-- 标题：应用名称 -->
      <h2 style="margin: 0 0 8px; font-size: 20px; color: #1a3b66">{app_name}</h2>

      <!-- 副标题：操作类型 -->
      <div style="margin-bottom: 24px; font-size: 13px; color: #6b7c93">{action}验证码</div>

      <!-- 验证码展示区 -->
      <div
        style="
          padding: 18px;
          background: #eef4ff;
          border: 1px dashed #b9d0f7;
          border-radius: 10px;
          text-align: center;
          font-family: monospace;
          font-size: 30px;
          font-weight: 700;
          letter-spacing: 0.32em;
          color: #1f6feb;
        "
      >
        {code}
      </div>

      <!-- 提示文字 -->
      <p style="margin-top: 24px; font-size: 13.5px; line-height: 1.7; color: #475569">
        请在 10 分钟内填入验证码完成{action}。<br />
        若非本人操作，请忽略本邮件，您的账号是安全的。
      </p>

      <hr style="margin: 24px 0; border: none; border-top: 1px solid #eef2f7" />

      <!-- 页脚说明 -->
      <div style="font-size: 11.5px; color: #94a3b8">本邮件由系统自动发送，请勿直接回复。</div>
    </div>
  </body>
</html>

name: SocraticMind
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  MindCore:
    path: Packages/MindCore
targets:
  SocraticMind:
    type: application
    platform: iOS
    sources:
      - SocraticMind
    dependencies:
      - package: MindCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gmaicoson.socraticmind
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SocraticMind
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          INFOPLIST_FILE: Config/Info-Debug.plist
          SOCRATICMIND_API_URL: http://127.0.0.1:8765/
        Release:
          INFOPLIST_FILE: Config/Info-Release.plist
          SOCRATICMIND_API_URL: ""
  SocraticMindUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: SocraticMind
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gmaicoson.socraticmind.uitests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info-UITests.plist
        TEST_TARGET_NAME: SocraticMind
schemes:
  SocraticMind:
    build:
      targets:
        SocraticMind: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SocraticMindUITests
    archive:
      config: Release
